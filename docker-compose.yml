services:

  db:
    image: postgres:16
    container_name: fincart-db
    environment:
      POSTGRES_DB: fincart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fincart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fincart-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/fincart_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: